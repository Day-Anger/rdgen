name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_file:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets pointer
        shell: bash
        run: |
          # The uuid filename alone is unguessable, but mask it anyway so
          # tracebacks and echoes below cannot leak it into public logs.
          echo "::add-mask::${{ inputs.zip_file }}"

      - name: Download with Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time

            # Server base URL comes from the GENURL repo secret (auto-masked),
            # only the random zip filename travels as a dispatch input.
            url = f"${{ secrets.GENURL }}/get_zip?filename=${{ inputs.zip_file }}"

            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1